# Production Apache hardening. Mounted into conf-enabled by docker-compose.prod.yml
# (the "zz-" prefix makes it load after the image's own security.conf, so these values win).
ServerTokens Prod
ServerSignature Off
TraceEnable Off

# Files that disclose the WordPress version or expose attack surface. The same rules live in the
# MU-plugin for xmlrpc; this denies them before PHP is involved.
<FilesMatch "^(readme\.html|license\.txt|xmlrpc\.php|wp-config-sample\.php)$">
    Require all denied
</FilesMatch>

# Never serve dotfiles (.env, .git, .htpasswd ...). Exception for /.well-known (ACME, security.txt).
<LocationMatch "/\.(?!well-known)">
    Require all denied
</LocationMatch>
