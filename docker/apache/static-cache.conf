# Far-future caching for static theme/plugin assets (not mounted by default; see docs/perf notes).
# Mount into /etc/apache2/conf-enabled/ and `a2enmod expires headers` (wordpress image: headers+expires are off by default).
# CSS/JS are enqueued with ?ver=<ASTONA_VERSION>, so a version bump busts them. Fonts are renamed on change.
<IfModule mod_expires.c>
    <IfModule mod_headers.c>
        <LocationMatch "^/wp-content/(themes|plugins)/[^/]+/assets/.*\.(woff2|css|js|svg|png|jpe?g|webp|avif)$">
            ExpiresActive On
            ExpiresDefault "access plus 1 year"
            Header append Cache-Control "public, immutable"
        </LocationMatch>
    </IfModule>
</IfModule>
