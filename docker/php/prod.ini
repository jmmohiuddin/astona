; Production PHP overrides. Mounted over the image defaults by docker-compose.prod.yml.
display_errors=Off
display_startup_errors=Off
html_errors=Off
log_errors=On
error_log=/dev/stderr
expose_php=Off
allow_url_include=Off

; Uploads (admission photos are limited to 2 MB by the plugin; media uploads by staff up to 12 MB).
upload_max_filesize=12M
post_max_size=16M
memory_limit=256M
max_execution_time=30
